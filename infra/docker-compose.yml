version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MQTT Broker (Eclipse Mosquitto with TLS & Auth)
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: veilsense_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/config/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - veilsense_net

  # ----------------------------------------------------------------------------
  # VeilSense Backend Service (FastAPI + Preprocessing + ML Model)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: veilsense_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - MQTT_TLS_PORT=8883
      - MQTT_USE_TLS=false
      - JWT_SECRET=veilsense_super_secret_jwt_key_2025
    volumes:
      - ../data:/app/data
      - ../ml/models:/app/ml/models
      - backend_db:/app/backend
    depends_on:
      - mosquitto
    networks:
      - veilsense_net

  # ----------------------------------------------------------------------------
  # VeilSense Frontend (Next.js 14 App Router)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: veilsense_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/live
    depends_on:
      - backend
    networks:
      - veilsense_net

networks:
  veilsense_net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_db:
