# ==============================================================================
# VeilSense Mosquitto Broker Configuration
# Production TLS 1.3 / 1.2 Configuration with Role-Based Authentication
# ==============================================================================

# Global persistence
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all
log_timestamp true

# ------------------------------------------------------------------------------
# Secure TLS Listener (External / Edge Node Ingestion)
# ------------------------------------------------------------------------------
listener 8883
protocol mqtt

# Certificate Configuration
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

# TLS Security Settings
tls_version tlsv1.3
require_certificate false # Set true for strict mTLS client certificate verification
ciphers_tls1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

# ------------------------------------------------------------------------------
# Internal Local Bridge Listener (Docker Bridge Network Only)
# ------------------------------------------------------------------------------
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/password_file

# ------------------------------------------------------------------------------
# Access Control List (ACL)
# ------------------------------------------------------------------------------
# Topic isolation:
# ESP32 can publish to telemetry and subscribe to actuation
# Backend can subscribe to telemetry and publish to actuation
