# =============================================================================
# Eclipse Mosquitto configuration for the AIoT secure MQTT broker.
#
# Security posture enforced here:
#   * Listener ONLY on TLS port 8883 (no plain-text 1883 listener exposed).
#   * Anonymous connections are rejected outright.
#   * Every client must authenticate via password_file (see ./passwd).
#   * Authorization is per-topic via acl_file (see ./acl):
#       - sim_user    may ONLY PUBLISH  to home/room1/telemetry
#       - ingest_user may ONLY SUBSCRIBE to home/room1/telemetry
#   * Broker TLS material lives under /mosquitto/certs/ (copied in Dockerfile).
# =============================================================================

listener 8883
protocol mqtt

# ---- TLS material ----------------------------------------------------------
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Require TLS on this listener; reject downgrade attempts.
require_certificate false
use_identity_as_username false

# ---- Authentication --------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd

# ---- Authorization ---------------------------------------------------------
acl_file /mosquitto/config/acl

# ---- Broker behaviour ------------------------------------------------------
persistence false
# No local persistence (the SQLite DB on the ingestion service owns durable
# data for this simulation stack). Turning it off also keeps containers
# stateless between runs.

connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
